<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UltraGram</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="theme-dark">
<div id="app">
  <!-- Auth screen -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="logo">🔥 UltraGram</div>
      <div class="auth-tabs">
        <button id="tabLogin" class="active">Вход</button>
        <button id="tabRegister">Регистрация</button>
      </div>
      <form id="loginForm" class="auth-form">
        <div style="display:flex;gap:6px">
          <select id="loginCountry" style="width:90px;padding:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:10px">
            <option value="+380">🇺🇦 +380</option>
            <option value="+7">🇷🇺 +7</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+90">🇹🇷 +90</option>
            <option value="+375">🇧🇾 +375</option>
            <option value="+77">🇰🇿 +77</option>
            <option value="+998">🇺🇿 +998</option>
          </select>
          <input type="tel" id="loginPhone" placeholder="Номер телефона" style="flex:1" required>
        </div>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button type="submit" class="btn-primary">Войти</button>
        <button type="button" id="loginResetBtn" class="btn-ghost" style="font-size:12px">Забыли пароль?</button>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <div style="display:flex;gap:6px">
          <select id="regCountry" style="width:90px;padding:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:10px">
            <option value="+380">🇺🇦 +380</option>
            <option value="+7">🇷🇺 +7</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+90">🇹🇷 +90</option>
            <option value="+375">🇧🇾 +375</option>
            <option value="+77">🇰🇿 +77</option>
            <option value="+998">🇺🇿 +998</option>
          </select>
          <input type="tel" id="regPhone" placeholder="Номер телефона" style="flex:1" required>
        </div>
        <input type="password" id="regPassword" placeholder="Пароль" required>
        <input type="password" id="regPassword2" placeholder="Повтор пароля" required>
        <input type="text" id="regName" placeholder="Имя">
        <input type="text" id="regUsername" placeholder="Username (необязательно)">
        <button type="button" id="verifyCreateBtn" class="btn-primary">Создать аккаунт</button>
      </form>
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="mainApp" class="main-app hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-small">🔥 UltraGram</div>
        <button id="newChatBtn" class="icon-btn" title="Новый чат">＋</button>
      </div>
      <div class="search-box">
        <input id="chatSearch" placeholder="Поиск чатов и пользователей">
      </div>
      <div id="chatList" class="chat-list"></div>
      <div class="sidebar-footer">
        <button class="nav-btn" data-view="wallet"><img src="/assets/icons/wallet.svg" width="16" height="16" style="vertical-align:middle;margin-right:4px"> Кошелёк</button>
        <button class="nav-btn" data-view="gifts"><img src="/assets/icons/gift.svg" width="16" height="16" style="vertical-align:middle;margin-right:4px"> Подарки</button>
        <button class="nav-btn" data-view="profile"><img src="/assets/icons/users.svg" width="16" height="16" style="vertical-align:middle;margin-right:4px"> Профиль</button>
        <button class="nav-btn" data-view="settings"><img src="/assets/icons/settings.svg" width="16" height="16" style="vertical-align:middle;margin-right:4px"> Настройки</button>
        <button class="nav-btn" data-view="admin" id="adminNavBtn" style="display:none"><img src="/assets/icons/users.svg" width="16" height="16" style="vertical-align:middle;margin-right:4px"> Админ</button>
      </div>
    </aside>
    <main class="content">
      <div id="chatView" class="view">
        <div id="chatHeader" class="chat-header">
          <div class="chat-title" id="chatTitle">Выберите чат</div>
        </div>
        <div id="messages" class="messages"></div>
        <div class="composer">
          <button id="attachBtn" title="Прикрепить файл" disabled style="padding:0 10px;border:none;background:var(--bg3);color:var(--text);border-radius:10px;cursor:pointer">📎</button>
          <button id="voiceBtn" title="Голосовое сообщение" disabled style="padding:0 10px;border:none;background:var(--bg3);color:var(--text);border-radius:10px;cursor:pointer"><img src="/assets/icons/mic.svg" width="18" height="18" style="vertical-align:middle"></button>
          <input id="messageInput" placeholder="Сообщение..." disabled>
          <button id="sendBtn" disabled>➤</button>
        </div>
        <input type="file" id="fileInput" multiple style="display:none">
      </div>
      <div id="walletView" class="view hidden"></div>
      <div id="giftsView" class="view hidden"></div>
      <div id="profileView" class="view hidden"></div>
      <div id="settingsView" class="view hidden"></div>
      <div id="adminView" class="view hidden"></div>
    </main>
  </div>
</div>

<!-- New chat modal -->
<div id="newChatModal" class="modal hidden">
  <div class="modal-card">
    <h3>Новый чат</h3>
    <input id="newChatUser" placeholder="Username или email пользователя">
    <div class="modal-actions">
      <button id="createDmBtn" class="btn-primary">Создать личный чат</button>
      <button id="createGroupBtn" class="btn-secondary">Создать группу</button>
      <button id="closeModalBtn" class="btn-ghost">Закрыть</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
