name: Build & Release UltraGram Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/ultragram-release.jks
          {
            echo "storeFile=ultragram-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon -Pultragram.baseUrl="${{ vars.ULTRAGRAM_BASE_URL }}"
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/UltraGram-1.0.0.F2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraGram-1.0.0.F2
          path: android/app/build/outputs/UltraGram-1.0.0.F2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: UltraGram Android 1.0.0.F2
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/UltraGram-1.0.0.F2.apk
          generate_release_notes: true
